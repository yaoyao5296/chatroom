# Netlify Edge Function 部署配置
# 必须通过 Git 集成或 netlify deploy 部署（ZIP 上传不支持 Edge Functions）

[[edge_functions]]
  function = "wake"
  path = "/"

[[edge_functions]]
  function = "wake"
  path = "/wake"

[[edge_functions]]
  function = "wake"
  path = "/status"

[[edge_functions]]
  function = "wake"
  path = "/health"

# 静态文件目录（可选，Edge Function 优先匹配）
[build]
  publish = "netlify-public"
  command = "echo 'edge function mode — no static build needed'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store,no-cache,must-revalidate"
