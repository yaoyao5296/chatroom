# Cloudflare Worker 部署配置
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/

name = "chatroom-codespace-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# 固定的 Worker 入口 URL（部署后）：
# https://chatroom-codespace-proxy.<your-subdomain>.workers.dev
# 把这个地址分享给用户即可，永久不变

# ============ 环境变量 ============
# 部署前请修改下面这些值，或在 Cloudflare Dashboard 里用 secret 设置敏感值
[vars]
GH_OWNER = "yaoyao5296"        # GitHub 仓库 owner
GH_REPO = "chatroom"           # GitHub 仓库名
GH_BRANCH = "master"           # 仓库分支

# Codespace 名称（GitHub Codespaces 自动生成的 name，形如 "chaos-monkey-abc123"）
# 获取方式：在本地或 Codespace 终端运行 `gh codespace list` 查看 NAME 列
CODESPACE_NAME = "REPLACE_WITH_YOUR_CODESPACE_NAME"

# 默认 Codespace 公开 URL（兜底用，bootstrap 脚本会上报真实 URL 到 .codespace-url）
# 格式：https://<codespace-name>-3001.app.github.dev
DEFAULT_PUBLIC_URL = "REPLACE_WITH_YOUR_DEFAULT_PUBLIC_URL"

# ============ KV 命名空间（缓存 Codespace 状态，减少 GitHub API 调用） ============
# 部署前先创建：npx wrangler kv namespace create CHATROOM_KV
# 然后把返回的 id 填到下面
[[kv_namespaces]]
binding = "CHATROOM_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ============ 敏感变量（用 secret，不要写这里） ============
# GH_PAT：GitHub Personal Access Token（需要 codespace 权限）
# 设置命令：npx wrangler secret put GH_PAT
# 然后粘贴你的 PAT 值
