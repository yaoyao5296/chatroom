org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=false
android.useAndroidX=true

# 直连阿里云镜像（国内直连最快，不走代理）
systemProp.http.proxyHost=
systemProp.https.proxyHost=

# 告诉 Gradle toolchain 已安装的 JDK 路径（capacitor 子项目要求 JDK 21）
org.gradle.java.installations.paths=/root/.local/share/mise/installs/java/17.0.2,/root/.local/share/mise/installs/java/21.0.2,/root/.local/share/mise/installs/java/25.0.2

# 抑制 compileSdk=36 警告
android.suppressUnsupportedCompileSdk=36
