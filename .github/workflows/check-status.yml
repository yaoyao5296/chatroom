name: Check Status

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 8.163.56.203
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 1m
          script: |
            echo "=== 内存状态 ==="
            free -m
            echo "=== 进程 ==="
            ps aux --sort=-%mem | head -10
            echo "=== 端口 3001 ==="
            ss -tlnp | grep 3001 || echo "无进程监听 3001"
            echo "=== Server Log ==="
            tail -20 /opt/chatroom/logs/server.log 2>/dev/null || echo "无日志"
            echo "=== PM2 Error ==="
            cat /opt/chatroom/logs/pm2-error.log 2>/dev/null | tail -20 || echo "无日志"
            echo "=== PM2 Out ==="
            cat /opt/chatroom/logs/pm2-out.log 2>/dev/null | tail -20 || echo "无日志"