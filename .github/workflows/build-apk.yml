name: Build ChatRoom Signed APK (for F-Droid)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 读取服务器地址（存在 .env.apk 时）
        run: if [ -f .env.apk ]; then cp .env.apk .env; fi

      - name: npm ci + build 前端 dist
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build 2>&1 | tail -30 || (ls dist 2>/dev/null && echo "dist exists, skip")
          echo "dist size: $(du -sh dist | cut -f1)"
          [ -f dist/index.html ] && echo "OK dist/index.html"

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (Wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-write-only: true

      - name: 写入 keystore + keystore.properties
        env:
          CHATROOM_KEYSTORE_B64: ${{ secrets.CHATROOM_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$CHATROOM_KEYSTORE_B64" ]; then
            echo "$CHATROOM_KEYSTORE_B64" | base64 -d > chatroom-release.keystore
            SP=${STORE_PASS:-Zjp120310}
            KP=${KEY_PASS:-Zjp120310}
          else
            keytool -genkeypair -v \
              -keystore chatroom-release.keystore \
              -alias chatroom \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass Zjp120310 -keypass Zjp120310 \
              -dname "CN=ChatRoom, OU=Dev, O=ChatRoom, L=CN, ST=CN, C=CN" 2>&1 | tail -5
            SP=Zjp120310
            KP=Zjp120310
          fi
          cat > android/keystore.properties <<EOF
          storeFile=$(pwd)/chatroom-release.keystore
          storePassword=$SP
          keyAlias=chatroom
          keyPassword=$KP
          EOF
          ls -lh chatroom-release.keystore android/keystore.properties
          keytool -list -keystore chatroom-release.keystore -storepass "$SP" 2>&1 | head -6

      - name: 安装 Capacitor + npx cap sync android
        run: |
          set -e
          if ! grep -q '"@capacitor/cli"' package.json; then
            npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android 2>&1 | tail -10
          fi
          cat > capacitor.config.ts <<'CAP'
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.chatroom.app',
            appName: 'ChatRoom',
            webDir: 'dist',
            server: { androidScheme: 'https', cleartext: true }
          };
          export default config;
          CAP
          cat capacitor.config.ts
          if [ -d android/app/src/main ]; then
            npx cap sync android 2>&1 | tail -20
          else
            (npx cap init ChatRoom com.chatroom.app --web-dir=dist < /dev/null || true) 2>&1 | tail -10
            (npx cap add android < /dev/null || true) 2>&1 | tail -10
            npx cap sync android 2>&1 | tail -20
          fi
          [ -f android/app/build.gradle ] && echo "OK: android/app/build.gradle"

      - name: 修复根 build.gradle + 补丁注入签名
        run: |
          set -e
          # ===== (A) 修复根 build.gradle：apply variables + AGP 8.10.2 classpath =====
          # （androidx.core 1.17+ / activity 1.11+ 需要 AGP ≥ 8.9.1；Capacitor v8 用 JDK 21）
          RBF=android/build.gradle
          [ -f "$RBF" ] || { echo "❌ 找不到 $RBF"; ls android; exit 1; }
          # 版本 ≥ 8.9 才满足 AAR metadata 要求
          NEED_REWRITE=0
          if ! grep -qF "variables.gradle" "$RBF"; then
            NEED_REWRITE=1
          fi
          AGP_VER=$(grep -oE "com\.android\.tools\.build:gradle:[0-9.]+" "$RBF" | head -1 | cut -d: -f3 || true)
          if [ -z "$AGP_VER" ]; then
            NEED_REWRITE=1
          else
            # 简单版本比较：8.9/8.10 满足；8.5/8.6/8.7/8.8 不满足
            MAJ=$(echo "$AGP_VER" | cut -d. -f1)
            MIN=$(echo "$AGP_VER" | cut -d. -f2)
            if [ "$MAJ" -lt 8 ] || { [ "$MAJ" -eq 8 ] && [ "$MIN" -lt 9 ]; }; then
              echo "ℹ️ 当前 AGP=$AGP_VER 低于 8.9，需要升级"
              NEED_REWRITE=1
            fi
          fi
          if [ "$NEED_REWRITE" -eq 1 ]; then
            cp "$RBF" "$RBF.bak.ci"
            cat > "$RBF" <<'GRADLEROOT'
          apply from: "variables.gradle"
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.9.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) { delete rootProject.buildDir }
          GRADLEROOT
            echo "✅ 根 build.gradle 已重写（variables.gradle + AGP 8.9.1 classpath）"
          else
            echo "✅ 根 build.gradle 已正确（AGP $AGP_VER，包含 variables.gradle），跳过"
          fi
          echo "===== 根 build.gradle 前 20 行 ====="
          head -20 "$RBF"
          echo ""

          # ===== (B) 补丁式注入 app/build.gradle 签名配置 =====
          BF=android/app/build.gradle
          [ -f "$BF" ] || { echo "❌ 找不到 $BF"; ls android/app; exit 1; }

          if grep -qF "signingConfig signingConfigs.release" "$BF" \
             && grep -qF "keyAlias" "$BF"; then
            echo "✅ app/build.gradle 已有签名配置，跳过"
            head -30 "$BF"
            exit 0
          fi

          cp "$BF" "$BF.bak.ci"

          # B-1: 头部注入 keystore 加载代码
          if ! grep -qF "keystore.properties" "$BF"; then
            python3 - "$BF" <<'PYEOF'
          import sys, re
          p = sys.argv[1]
          with open(p, 'r', encoding='utf-8') as f:
            content = f.read()
          header = '''// 读取 keystore.properties（CI 注入）
          def chatroomKsf = rootProject.file("keystore.properties")
          def chatroomKs = new Properties()
          if (chatroomKsf.exists()) {
              chatroomKs.load(new FileInputStream(chatroomKsf))
          }

          '''
          content = re.sub(
              r"(?m)^(\s*apply\s+plugin:\s*['\"]com\.android\.application['\"])",
              header + r"\1", content, count=1)
          with open(p, 'w', encoding='utf-8') as f:
            f.write(content)
          PYEOF
            echo "   + 注入 keystore 读取代码 OK"
          fi

          # B-2: android {} 内加入 signingConfigs.release（在 defaultConfig 前）
          if ! grep -qF "signingConfigs" "$BF"; then
            python3 - "$BF" <<'PYEOF2'
          import sys, re
          p = sys.argv[1]
          with open(p, 'r', encoding='utf-8') as f:
            content = f.read()
          sig = '''    signingConfigs {
              release {
                  storeFile file(chatroomKs["storeFile"])
                  storePassword chatroomKs["storePassword"]
                  keyAlias chatroomKs["keyAlias"]
                  keyPassword chatroomKs["keyPassword"]
              }
          }

          '''
          content = re.sub(
              r"(?m)^(\s*defaultConfig\s*\{)",
              sig + r"\1", content, count=1)
          with open(p, 'w', encoding='utf-8') as f:
            f.write(content)
          PYEOF2
            echo "   + 注入 signingConfigs OK"
          fi

          # B-3: buildTypes.release 加入 signingConfig signingConfigs.release
          python3 - "$BF" <<'PYEOF3'
          import sys, re
          p = sys.argv[1]
          with open(p, 'r', encoding='utf-8') as f:
            content = f.read()
          # 找到 release { 块，内部若无 signingConfig 则插入
          m = re.search(r"(?m)^(\s*)release\s*\{", content)
          if m:
            indent_outer = m.group(1)
            i = m.end()
            depth = 1
            has_sig = False
            chunk_start = m.start()
            while i < len(content) and depth > 0:
                if content[i] == '{':
                    depth += 1
                elif content[i] == '}':
                    depth -= 1
                if 'signingConfig' in content[max(0,i-80):i+50]:
                    has_sig = True
                i += 1
            if not has_sig:
                # 在 release { 之后的第一个换行处插入 signingConfig
                insert_pos = m.end()
                insert_text = "\n" + indent_outer + "        signingConfig signingConfigs.release\n"
                content = content[:insert_pos] + insert_text + content[insert_pos:]
                with open(p, 'w', encoding='utf-8') as f:
                    f.write(content)
          PYEOF3
          echo "   + 注入 buildTypes.release.signingConfig OK"

          echo ""
          echo "✅ app/build.gradle 签名补丁完成"
          echo "===== signingConfigs 片段 ====="
          grep -n -A8 "signingConfigs" "$BF" | head -15
          echo ""
          echo "===== buildTypes release 片段 ====="
          grep -n -A12 "buildTypes" "$BF" | head -20

      - name: Gradle assembleRelease
        run: |
          set -eo pipefail
          cd android
          chmod +x ./gradlew
          # 输出完整日志到文件，尾部 300 行显示到 CI 日志；失败时自动 grep 错误
          set +e
          ./gradlew --no-daemon --parallel --stacktrace clean assembleRelease \
            > /tmp/gradle-build.log 2>&1
          RC=$?
          set -e
          echo "===== Gradle 构建日志尾部 300 行 ====="
          tail -n 300 /tmp/gradle-build.log
          echo ""
          echo "===== 错误摘要（搜索 FAILURE / error / Exception / FAILED tasks）====="
          grep -n -E "FAILURE:|> Task .* FAILED|Caused by:|error:" /tmp/gradle-build.log | tail -30 || true
          echo ""
          if [ $RC -ne 0 ]; then
            echo "❌ Gradle 构建失败 (exit=$RC)，查看错误详情："
            awk '/FAILURE: Build failed/,/BUILD FAILED/' /tmp/gradle-build.log | head -80
            exit $RC
          fi
          echo "✅ Gradle 构建成功"
          echo ""
          echo "📦 APK 产物:"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 重命名 → release/chatroom.apk
        run: |
          set -e
          APK_IN=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$APK_IN" ] || { echo "❌ 找不到 release APK"; find android/app/build -name "*.apk"; exit 1; }
          mkdir -p release
          cp "$APK_IN" release/chatroom.apk
          ls -lh release/chatroom.apk
          sha256sum release/chatroom.apk

      - name: Upload Artifact chatroom-signed-apk
        uses: actions/upload-artifact@v4
        with:
          name: chatroom-signed-apk
          path: release/chatroom.apk
          if-no-files-found: error

      - name: GitHub Release 上传 chatroom.apk (tag v* 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ChatRoom ${{ github.ref_name }}
          files: release/chatroom.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: 替换签名 APK 到源代码 public/ChatRoom.apk 并推送
        run: |
          set -e
          mkdir -p public
          cp release/chatroom.apk public/ChatRoom.apk
          ls -lh public/ChatRoom.apk
          sha256sum public/ChatRoom.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ChatRoom.apk
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "chore: 更新签名版 ChatRoom.apk [skip ci]"
            # 防止其他 push（例如 CI 同步的配置 commit、codespace 配置改动）比本 build 新导致 rejected
            # —— 最多重试 3 次 pull --rebase 再 push
            RETRY=0
            while ! git push; do
              RETRY=$((RETRY + 1))
              if [ $RETRY -ge 3 ]; then
                echo "❌ push 重试 $RETRY 次均失败，放弃"
                exit 1
              fi
              echo "⚠ push 被拒，第 $RETRY 次 fetch + rebase 后重试..."
              git fetch origin master
              git rebase origin/master
            done
            echo "✅ 签名 APK 已替换到源代码 public/ChatRoom.apk"
          fi
