name: Build ChatRoom Signed APK (for F-Droid)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci + build 前端 dist
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build 2>&1 | tail -30 || (ls dist 2>/dev/null && echo "dist exists, skip")
          echo "dist size: $(du -sh dist | cut -f1)"
          [ -f dist/index.html ] && echo "OK dist/index.html"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (Wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-write-only: true

      - name: 写入 keystore + keystore.properties
        env:
          CHATROOM_KEYSTORE_B64: ${{ secrets.CHATROOM_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$CHATROOM_KEYSTORE_B64" ]; then
            echo "$CHATROOM_KEYSTORE_B64" | base64 -d > chatroom-release.keystore
            SP=${STORE_PASS:-Zjp120310}
            KP=${KEY_PASS:-Zjp120310}
          else
            keytool -genkeypair -v \
              -keystore chatroom-release.keystore \
              -alias chatroom \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass Zjp120310 -keypass Zjp120310 \
              -dname "CN=ChatRoom, OU=Dev, O=ChatRoom, L=CN, ST=CN, C=CN" 2>&1 | tail -5
            SP=Zjp120310
            KP=Zjp120310
          fi
          cat > android/keystore.properties <<EOF
          storeFile=$(pwd)/chatroom-release.keystore
          storePassword=$SP
          keyAlias=chatroom
          keyPassword=$KP
          EOF
          ls -lh chatroom-release.keystore android/keystore.properties
          keytool -list -keystore chatroom-release.keystore -storepass "$SP" 2>&1 | head -6

      - name: 安装 Capacitor + npx cap sync android
        run: |
          set -e
          if ! grep -q '"@capacitor/cli"' package.json; then
            npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android 2>&1 | tail -10
          fi
          cat > capacitor.config.ts <<'CAP'
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.chatroom.app',
            appName: 'ChatRoom',
            webDir: 'dist',
            server: { androidScheme: 'https', cleartext: true }
          };
          export default config;
          CAP
          cat capacitor.config.ts
          if [ -d android/app/src/main ]; then
            npx cap sync android 2>&1 | tail -20
          else
            (npx cap init ChatRoom com.chatroom.app --web-dir=dist < /dev/null || true) 2>&1 | tail -10
            (npx cap add android < /dev/null || true) 2>&1 | tail -10
            npx cap sync android 2>&1 | tail -20
          fi
          [ -f android/app/build.gradle ] && echo "OK: android/app/build.gradle"

      - name: 注入 Gradle 签名（去重，无重复变量）
        run: |
          set -e
          BF=android/app/build.gradle
          [ -f "$BF" ] || { echo "❌ 找不到 $BF"; ls android/app; exit 1; }
          # 已经注入过就跳过
          if grep -qF "signingConfig signingConfigs.release" "$BF" \
             && ( grep -qF "keyAlias chatroomKs" "$BF" || grep -qF 'keyAlias keystoreProperties["keyAlias"]' "$BF" ); then
            echo "✅ build.gradle 已包含签名配置，跳过注入"
            head -20 "$BF"
            exit 0
          fi
          # 否则：先备份 → 写一份没有重复变量的干净模板
          cp "$BF" "$BF.bak.ci"
          cat > "$BF" <<'GRADLE'
          apply plugin: 'com.android.application'
          def chatroomKsf = rootProject.file("keystore.properties")
          def chatroomKs = new Properties()
          if (chatroomKsf.exists()) {
              chatroomKs.load(new FileInputStream(chatroomKsf))
          }
          android {
              namespace = "com.chatroom.app"
              compileSdk = rootProject.ext.compileSdkVersion
              signingConfigs {
                  release {
                      storeFile file(chatroomKs["storeFile"])
                      storePassword chatroomKs["storePassword"]
                      keyAlias chatroomKs["keyAlias"]
                      keyPassword chatroomKs["keyPassword"]
                  }
              }
              defaultConfig {
                  applicationId "com.chatroom.app"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode 1
                  versionName "1.0"
                  aaptOptions {
                      ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          repositories {
              flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }
          }
          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation project(':capacitor-android')
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')
          }
          apply from: 'capacitor.build.gradle'
          try {
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text) { apply plugin: 'com.google.gms.google-services' }
          } catch(Exception e) {
              logger.info("google-services.json not found")
          }
          GRADLE
          echo "✅ build.gradle 已重写（前缀 chatroomKsf / chatroomKs，无重复变量风险）"
          head -25 "$BF"

      - name: Gradle assembleRelease
        run: |
          set -e
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon --parallel --stacktrace clean assembleRelease 2>&1 | tail -60
          echo ""
          echo "📦 APK 产物:"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 重命名 → release/chatroom.apk
        run: |
          set -e
          APK_IN=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$APK_IN" ] || { echo "❌ 找不到 release APK"; find android/app/build -name "*.apk"; exit 1; }
          mkdir -p release
          cp "$APK_IN" release/chatroom.apk
          ls -lh release/chatroom.apk
          sha256sum release/chatroom.apk

      - name: Upload Artifact chatroom-signed-apk
        uses: actions/upload-artifact@v4
        with:
          name: chatroom-signed-apk
          path: release/chatroom.apk
          if-no-files-found: error

      - name: GitHub Release 上传 chatroom.apk (tag v* 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ChatRoom ${{ github.ref_name }}
          files: release/chatroom.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
