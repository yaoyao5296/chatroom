name: 打包手机 APK

on:
  push:
    branches: [master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 设置 Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: npm install

      - name: 构建前端
        run: npx vite build

      - name: 同步 Android 项目
        run: npx cap sync android

      - name: 打包 APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: 重命名 APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChatRoom.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v5
        with:
          name: ChatRoom-APK
          path: ChatRoom.apk

      - name: 部署 APK 到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 8.163.56.203
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: mkdir -p /opt/chatroom/public

      - name: 上传 APK 到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 8.163.56.203
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: ChatRoom.apk
          target: /opt/chatroom/public/
          strip_components: 0