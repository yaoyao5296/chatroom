name: Build ChatRoom Signed APK (for F-Droid)
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci + build 前端 dist
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build || (ls dist 2>/dev/null && echo "dist already exists, skipping build")
          echo "dist size: $(du -sh dist | cut -f1)"
          ls dist/index.html

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (Wrapper) + 国内 Maven 镜像加速
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-write-only: true

      - name: 写入 keystore + keystore.properties (从 Secrets)
        env:
          CHATROOM_KEYSTORE_B64: ${{ secrets.CHATROOM_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          # 优先用 Secrets；如果为空用 Termux 默认密码占位（F-Droid 自己会重签，不影响 RFP）
          if [ -n "$CHATROOM_KEYSTORE_B64" ]; then
            echo "$CHATROOM_KEYSTORE_B64" | base64 -d > chatroom-release.keystore
            SP=${STORE_PASS:-Zjp120310}
            KP=${KEY_PASS:-Zjp120310}
          else
            # 没有 Secrets 时生成临时调试 keystore（别名 chatroom），方便测试
            keytool -genkeypair -v \
              -keystore chatroom-release.keystore \
              -alias chatroom \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass Zjp120310 -keypass Zjp120310 \
              -dname "CN=ChatRoom, OU=Dev, O=ChatRoom, L=CN, ST=CN, C=CN"
            SP=Zjp120310; KP=Zjp120310
          fi
          cat > android/keystore.properties <<EOF
          storeFile=$(pwd)/chatroom-release.keystore
          storePassword=$SP
          keyAlias=chatroom
          keyPassword=$KP
          EOF
          cat android/keystore.properties
          ls -lh chatroom-release.keystore
          keytool -list -keystore chatroom-release.keystore -storepass "$SP" | head -5

      - name: 安装 Capacitor CLI + 初始化 Android + Cap Sync
        run: |
          set -e
          if ! grep -q '"@capacitor/cli"' package.json; then
            npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android
          fi
          # 写/覆盖 capacitor.config.ts
          cat > capacitor.config.ts <<'CAP'
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.chatroom.app',
            appName: 'ChatRoom',
            webDir: 'dist',
            server: { androidScheme: 'https', cleartext: true }
          };
          export default config;
          CAP
          # android 目录：有就 sync，没有就 add
          if [ -d android/app/src/main ]; then
            npx cap sync android
          else
            echo "y" | npx cap init ChatRoom com.chatroom.app --web-dir=dist || true
            echo "y" | npx cap add android || true
            npx cap sync android
          fi
          ls android/app

      - name: 注入 Gradle 签名配置到 android/app/build.gradle（别名 chatroom，安全去重）        run: |
          set -e
          BF=android/app/build.gradle
          [ -f "" ] || { echo "missing build.gradle"; exit 1; }
          # 若已经存在 signingConfigs.release，则跳过（本地仓库已注入）
          if grep -qF "signingConfigs" "" && grep -qF "signingConfig signingConfigs.release" ""; then
            echo "✅ 签名已存在于 build.gradle，跳过注入"
            head -30 ""
            exit 0
          fi
          # 否则：整份 build.gradle 重写为标准模板（避免 Python 注入的变量重复问题）
          cp "" ".bak.ci"
          cat > "" <<'GRADLE'
          apply plugin: 'com.android.application'
          def chatroomKsf = rootProject.file("keystore.properties")
          def chatroomKs = new Properties()
          if (chatroomKsf.exists()) {
              chatroomKs.load(new FileInputStream(chatroomKsf))
          }
          android {
              namespace = "com.chatroom.app"
              compileSdk = rootProject.ext.compileSdkVersion
              signingConfigs {
                  release {
                      storeFile file(chatroomKs["storeFile"])
                      storePassword chatroomKs["storePassword"]
                      keyAlias chatroomKs["keyAlias"]
                      keyPassword chatroomKs["keyPassword"]
                  }
              }
              defaultConfig {
                  applicationId "com.chatroom.app"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode 1
                  versionName "1.0"
                  aaptOptions {
                      ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          repositories {
              flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }
          }
          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation project(':capacitor-android')
              testImplementation "junit:junit:"
              androidTestImplementation "androidx.test.ext:junit:"
              androidTestImplementation "androidx.test.espresso:espresso-core:"
              implementation project(':capacitor-cordova-android-plugins')
          }
          apply from: 'capacitor.build.gradle'
          try {
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text) { apply plugin: 'com.google.gms.google-services' }
          } catch(Exception e) {
              logger.info("google-services.json not found")
          }
          GRADLE
          echo "✅ build.gradle 已重写安全模板（无重复变量）"
          head -30 ""

      - name: Gradle assembleRelease（生成签名 APK）
        run: |
          set -e
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon --parallel --stacktrace clean assembleRelease
          echo "=== APK 产物 ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 重命名 chatroom.apk + 上传 Artifacts
        run: |
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$APK_SRC" ] || { echo "APK 没找到"; find android/app/build -name "*.apk"; exit 1; }
          mkdir -p release
          cp "$APK_SRC" release/chatroom.apk
          ls -lh release/chatroom.apk
          sha256sum release/chatroom.apk
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true

      - name: Upload Artifact (chatroom-signed-apk)
        uses: actions/upload-artifact@v4
        with:
          name: chatroom-signed-apk
          path: release/chatroom.apk
          if-no-files-found: error

      - name: GitHub Release 上传 chatroom.apk（打 tag v* 时触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ChatRoom ${{ github.ref_name }}
          files: release/chatroom.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
