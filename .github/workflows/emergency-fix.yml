name: Emergency Fix

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Emergency fix via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 8.163.56.203
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            # 杀掉所有卡住的进程
            pkill -f "npm install" 2>/dev/null || true
            pkill -f "vite build" 2>/dev/null || true
            pkill -f "npx" 2>/dev/null || true
            sleep 2
            
            cd /opt/chatroom
            git remote set-url origin https://github.com/yaoyao5296/chatroom.git
            git fetch origin
            git reset --hard origin/master
            
            # 强制释放端口
            fuser -k 3001/tcp 2>/dev/null || true
            sleep 2
            
            # 重启服务
            pm2 delete chatroom 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            sleep 8
            
            echo "=== Health Check ==="
            curl -s -o /dev/null -w "HTTP: %{http_code}\n" http://localhost:3001/api/health
            echo "=== PM2 Status ==="
            pm2 list
            echo "=== Error Logs ==="
            tail -30 logs/pm2-error.log 2>/dev/null || true