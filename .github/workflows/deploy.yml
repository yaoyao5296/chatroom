name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: GitHub Device Flow Auth
        id: device_auth
        run: |
          echo "Requesting device code from GitHub..."
          DEVICE_RESP=$(curl -s -X POST https://github.com/login/device/code \
            -H "Accept: application/json" \
            -d "client_id=Iv1.558507eb9b186639&scope=user:email")
          
          echo "Response: $DEVICE_RESP"
          
          DEVICE_CODE=$(echo $DEVICE_RESP | python3 -c "import sys,json; print(json.load(sys.stdin)['device_code'])")
          USER_CODE=$(echo $DEVICE_RESP | python3 -c "import sys,json; print(json.load(sys.stdin)['user_code'])")
          VERIFY_URI=$(echo $DEVICE_RESP | python3 -c "import sys,json; print(json.load(sys.stdin)['verification_uri'])")
          
          echo "device_code=$DEVICE_CODE" >> $GITHUB_OUTPUT
          
          echo ""
          echo "============================================"
          echo "Please open: $VERIFY_URI"
          echo "And enter code: $USER_CODE"
          echo "============================================"
          echo ""

      - name: Poll for Access Token
        id: poll_token
        run: |
          DEVICE_CODE="${{ steps.device_auth.outputs.device_code }}"
          echo "Polling for authorization..."
          
          for i in $(seq 1 60); do
            sleep 5
            TOKEN_RESP=$(curl -s -X POST https://github.com/login/oauth/access_token \
              -H "Accept: application/json" \
              -d "client_id=Iv1.558507eb9b186639&device_code=$DEVICE_CODE&grant_type=urn:ietf:params:oauth:grant-type:device_code")
            
            echo "[$i] $TOKEN_RESP"
            
            ACCESS_TOKEN=$(echo $TOKEN_RESP | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))" 2>/dev/null || echo "")
            ERROR=$(echo $TOKEN_RESP | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error',''))" 2>/dev/null || echo "")
            
            if [ -n "$ACCESS_TOKEN" ]; then
              echo "Got access token!"
              echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            if [ "$ERROR" = "authorization_pending" ]; then
              echo "Waiting for user to authorize..."
            elif [ "$ERROR" = "slow_down" ]; then
              sleep 5
            elif [ -n "$ERROR" ]; then
              echo "Error: $ERROR - will retry"
            fi
          done
          echo "Timed out"
          exit 1

      - name: Deploy to Render via API
        env:
          GH_ACCESS_TOKEN: ${{ steps.poll_token.outputs.access_token }}
        run: |
          echo "Got GitHub access token, deploying to Render..."
          
          RENDER_RESP=$(curl -s -X POST https://api.render.com/v1/oauth/github \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"$GH_ACCESS_TOKEN\"}")
          
          echo "Render auth: $RENDER_RESP"
          
          RENDER_API_KEY=$(echo $RENDER_RESP | python3 -c "import sys,json; print(json.load(sys.stdin).get('apiKey',''))" 2>/dev/null || echo "")
          
          if [ -z "$RENDER_API_KEY" ]; then
            echo "Failed to get Render API key"
            exit 1
          fi
          
          echo "Got Render API key!"
          
          BLUEPRINT_RESP=$(curl -s -X POST https://api.render.com/v1/blueprints \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"repo\": \"git@github.com:yaoyao5296/chatroom.git\", \"branch\": \"master\"}")
          
          echo "Blueprint: $BLUEPRINT_RESP"