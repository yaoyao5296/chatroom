name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 8.163.56.203
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/chatroom
            git remote set-url origin https://github.com/yaoyao5296/chatroom.git
            git fetch origin
            git reset --hard origin/master
            npx vite build
            pm2 restart chatroom --update-env 2>/dev/null || pm2 start ecosystem.config.cjs
            sleep 5
            curl -s -o /dev/null -w "HTTP: %{http_code}" http://localhost:3001/api/health