name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 8.163.85.218
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/chatroom
            git remote set-url origin https://github.com/yaoyao5296/chatroom.git
            git fetch origin
            git reset --hard origin/master
            npm install --ignore-scripts
            npm rebuild better-sqlite3 sharp
            npx vite build
            pkill -f "node.*server" 2>/dev/null || true
            sleep 1
            NODE_ENV=production nohup node --env-file=.env --import tsx api/server.ts > /dev/null 2>&1 &
            sleep 2
            curl -s -o /dev/null -w "HTTP: %{http_code}" http://localhost:3001/