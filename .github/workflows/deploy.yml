name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python and Playwright
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Deploy to Render
        env:
          GH_EMAIL: 13574196538@163.com
          GH_PASSWORD: zjp120310
          MAIL_USER: 13574196538@163.com
          MAIL_PASS: JAhc35z4i5r9FdAy
        run: |
          python << 'PYEOF'
          import asyncio, os, imaplib, email, re, time
          from email.header import decode_header
          from playwright.async_api import async_playwright

          def get_verification_code():
              """Read GitHub verification code from 163.com email"""
              print("Connecting to 163.com IMAP to get verification code...")
              for attempt in range(15):
                  try:
                      mail = imaplib.IMAP4_SSL('imap.163.com', 993)
                      mail.login(os.environ['MAIL_USER'], os.environ['MAIL_PASS'])
                      mail.select('INBOX')

                      # Search for GitHub verification emails
                      status, messages = mail.search(None, 'FROM', 'noreply@github.com')
                      if status == 'OK' and messages[0]:
                          msg_ids = messages[0].split()
                          # Get the latest one
                          latest_id = msg_ids[-1]
                          status, msg_data = mail.fetch(latest_id, '(RFC822)')
                          if status == 'OK':
                              msg = email.message_from_bytes(msg_data[0][1])

                              # Decode subject
                              subject, encoding = decode_header(msg['Subject'])[0]
                              if isinstance(subject, bytes):
                                  subject = subject.decode(encoding or 'utf-8', errors='ignore')

                              print(f"Found email: {subject}")

                              # Get body
                              body = ''
                              if msg.is_multipart():
                                  for part in msg.walk():
                                      content_type = part.get_content_type()
                                      if content_type == 'text/plain' or content_type == 'text/html':
                                          try:
                                              payload = part.get_payload(decode=True)
                                              if payload:
                                                  body += payload.decode('utf-8', errors='ignore')
                                          except:
                                              pass
                              else:
                                  try:
                                      payload = msg.get_payload(decode=True)
                                      if payload:
                                          body = payload.decode('utf-8', errors='ignore')
                                  except:
                                      pass

                              # Find 6-digit code
                              codes = re.findall(r'\b(\d{6})\b', body)
                              if codes:
                                  code = codes[0]
                                  print(f"Found verification code: {code}")
                                  mail.logout()
                                  return code

                      mail.logout()
                  except Exception as e:
                      print(f"IMAP attempt {attempt+1} error: {e}")

                  print(f"Waiting for email... (attempt {attempt+1}/15)")
                  time.sleep(5)

              return None

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(viewport={'width': 1440, 'height': 900})
                  page = await ctx.new_page()

                  await page.add_init_script('''() => {
                      Object.defineProperty(navigator, 'webdriver', {get: () => false});
                      window.chrome = {runtime: {}};
                      const origQuery = window.navigator.permissions.query;
                      window.navigator.permissions.query = (params) =>
                          params.name === 'notifications'
                          ? Promise.resolve({state: Notification.permission})
                          : origQuery(params);
                      Object.defineProperty(navigator, 'plugins', {get: () => [1,2,3,4,5]});
                      Object.defineProperty(navigator, 'languages', {get: () => ['en-US','en']});
                  }''')

                  print("Step 1: Going to Render login...")
                  await page.goto('https://dashboard.render.com/login', timeout=30000, wait_until='networkidle')
                  await page.wait_for_timeout(3000)

                  try:
                      btn = page.locator('button:has-text("Accept All")')
                      if await btn.count() > 0:
                          await btn.click()
                  except:
                      pass

                  print("Step 2: GitHub OAuth...")
                  await page.click('button:has-text("GitHub")')
                  await page.wait_for_timeout(5000)
                  print(f"OAuth URL: {page.url}")

                  await page.fill('input[name="login"]', os.environ['GH_EMAIL'])
                  await page.fill('input[name="password"]', os.environ['GH_PASSWORD'])
                  await page.click('input[type="submit"]')
                  print("Submitted GitHub login")

                  print("Step 3: Handling verification...")
                  for i in range(30):
                      await page.wait_for_timeout(3000)
                      url = page.url
                      print(f"  [{i}] {url[:120]}")

                      if 'dashboard.render.com' in url and 'login' not in url and 'oauth' not in url:
                          print("*** ON DASHBOARD! ***")
                          break

                      # Check for device verification
                      if 'verified-device' in url:
                          print("Device verification required - checking email...")
                          code = get_verification_code()
                          if code:
                              print(f"Entering code: {code}")
                              await page.fill('input[name="code"], input[type="text"]', code)
                              await page.click('button[type="submit"], input[type="submit"]')
                              await page.wait_for_timeout(5000)
                              continue
                          else:
                              print("Could not get verification code")
                              await page.screenshot(path='/tmp/verify_failed.png')
                              break

                      if 'authorize' in url or 'session' in url:
                          try:
                              auth_btn = page.locator('button:has-text("Authorize"), button[name="authorize"]')
                              if await auth_btn.count() > 0:
                                  await auth_btn.first.click()
                                  print("Clicked authorize")
                                  await page.wait_for_timeout(5000)
                                  continue
                          except:
                              pass

                          redirect_url = await page.evaluate('''() => {
                              var meta = document.querySelector('meta[http-equiv="refresh"]');
                              if (meta) {
                                  var m = meta.getAttribute('content').match(/url=(.+)/);
                                  if (m) return m[1];
                              }
                              var link = document.querySelector('a[href*="dashboard.render.com"]');
                              if (link) return link.href;
                              return null;
                          }''')
                          if redirect_url:
                              print(f"Following redirect: {redirect_url[:80]}")
                              await page.goto(redirect_url, timeout=30000, wait_until='networkidle')
                              continue

                  print(f"Final URL: {page.url}")
                  await page.screenshot(path='/tmp/render_dashboard.png')

                  if 'dashboard.render.com' in page.url and 'login' not in page.url:
                      print("\nStep 4: Creating Blueprint...")
                      await page.goto('https://dashboard.render.com/blueprints/new', timeout=30000, wait_until='networkidle')
                      await page.wait_for_timeout(5000)
                      print(f"Blueprint URL: {page.url}")
                      await page.screenshot(path='/tmp/render_blueprint.png')

                      buttons = await page.evaluate('''() => {
                          var items = document.querySelectorAll('a, button');
                          var result = [];
                          for (var i = 0; i < items.length; i++) {
                              var b = items[i];
                              var text = (b.textContent || '').trim().slice(0, 100);
                              if (text) result.push({tag: b.tagName, text: text, href: (b.href || '').slice(0, 120)});
                          }
                          return result;
                      }''')
                      print(f"Elements: {buttons}")

                      clicked_connect = False
                      for btn in buttons:
                          txt = btn['text'].lower()
                          if 'connect' in txt or 'github' in txt or 'install' in txt:
                              if not clicked_connect:
                                  print(f"Clicking: {btn['text']}")
                                  try:
                                      await page.click(f'button:has-text("{btn["text"]}"), a:has-text("{btn["text"]}")')
                                      await page.wait_for_timeout(5000)
                                      print(f"After click: {page.url}")
                                      clicked_connect = True
                                  except Exception as e:
                                      print(f"Click error: {e}")

                      await page.screenshot(path='/tmp/render_after_connect.png')

                      if 'github.com' in page.url:
                          print("On GitHub App install page...")
                          await page.screenshot(path='/tmp/github_install.png')
                          try:
                              install_btn = page.locator('button:has-text("Install"), input[type="submit"][value*="Install"]')
                              if await install_btn.count() > 0:
                                  await install_btn.first.click()
                                  print("Clicked Install")
                                  await page.wait_for_timeout(5000)
                          except Exception as e:
                              print(f"Install click error: {e}")
                          await page.screenshot(path='/tmp/after_install.png')

                      await page.screenshot(path='/tmp/render_final.png')
                  else:
                      print("Failed to reach Render dashboard")

                  await browser.close()

          asyncio.run(main())
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-screenshots
          path: /tmp/render_*.png