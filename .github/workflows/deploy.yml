name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python and Playwright
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Debug - Login and print page HTML
        env:
          GH_EMAIL: 13574196538@163.com
          GH_PASSWORD: zjp120310
        run: |
          python << 'PYEOF'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(viewport={'width': 1440, 'height': 900})
                  page = await ctx.new_page()

                  await page.add_init_script('''() => {
                      Object.defineProperty(navigator, 'webdriver', {get: () => false});
                      window.chrome = {runtime: {}};
                  }''')

                  print("Step 1: Render login...")
                  await page.goto('https://dashboard.render.com/login', timeout=30000, wait_until='networkidle')
                  await page.wait_for_timeout(3000)

                  try:
                      btn = page.locator('button:has-text("Accept All")')
                      if await btn.count() > 0:
                          await btn.click()
                  except:
                      pass

                  print("Step 2: GitHub OAuth...")
                  await page.click('button:has-text("GitHub")')
                  await page.wait_for_timeout(5000)

                  await page.fill('input[name="login"]', os.environ['GH_EMAIL'])
                  await page.fill('input[name="password"]', os.environ['GH_PASSWORD'])
                  await page.click('input[type="submit"]')
                  print("Submitted GitHub login")
                  await page.wait_for_timeout(5000)

                  url = page.url
                  print(f"After login URL: {url}")
                  await page.screenshot(path='/tmp/after_login.png')

                  if 'verified-device' in url:
                      print("On verification page!")
                      html = await page.evaluate('() => document.body.innerHTML')
                      print(f"Page HTML: {html[:3000]}")
                      
                      inputs = await page.evaluate('''() => {
                          var items = document.querySelectorAll('input');
                          var result = [];
                          for (var i = 0; i < items.length; i++) {
                              var inp = items[i];
                              result.push({name: inp.name, type: inp.type, id: inp.id, class: inp.className, placeholder: inp.placeholder});
                          }
                          return result;
                      }''')
                      print(f"Input elements: {inputs}")
                      
                      btns = await page.evaluate('''() => {
                          var items = document.querySelectorAll('button, input[type="submit"]');
                          var result = [];
                          for (var i = 0; i < items.length; i++) {
                              var b = items[i];
                              result.push({tag: b.tagName, text: (b.textContent || b.value || '').trim().slice(0, 80), type: b.type, name: b.name});
                          }
                          return result;
                      }''')
                      print(f"Button elements: {btns}")

                  await page.screenshot(path='/tmp/render_debug.png')
                  await browser.close()

          asyncio.run(main())
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-screenshots
          path: /tmp/render_*.png