name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python and Playwright
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Trigger login to get verification code
        env:
          GH_EMAIL: 13574196538@163.com
          GH_PASSWORD: zjp120310
        run: |
          python << 'PYEOF'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context()
                  page = await ctx.new_page()

                  await page.add_init_script('''() => {
                      Object.defineProperty(navigator, 'webdriver', {get: () => false});
                      window.chrome = {runtime: {}};
                  }''')

                  print("Going to Render login...")
                  await page.goto('https://dashboard.render.com/login', timeout=30000, wait_until='networkidle')
                  await page.wait_for_timeout(3000)

                  print("Clicking GitHub login...")
                  await page.click('button:has-text("GitHub")')
                  await page.wait_for_timeout(5000)

                  print("Filling GitHub credentials...")
                  await page.fill('input[name="login"]', os.environ['GH_EMAIL'])
                  await page.fill('input[name="password"]', os.environ['GH_PASSWORD'])
                  await page.click('input[type="submit"]')

                  print("Waiting for verification page...")
                  for i in range(20):
                      await page.wait_for_timeout(3000)
                      url = page.url
                      print(f"  [{i}] {url[:100]}")
                      if 'verified-device' in url:
                          print("*** VERIFICATION CODE EMAIL SENT! ***")
                          print("Please check your email 13574196538@163.com")
                          await page.screenshot(path='/tmp/verify_page.png')
                          break
                      if 'dashboard.render.com' in url and 'login' not in url:
                          print("*** ON DASHBOARD! ***")
                          break

                  print(f"Final URL: {page.url}")
                  await page.screenshot(path='/tmp/render_final.png')
                  await browser.close()

          asyncio.run(main())
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-screenshots
          path: /tmp/render_*.png