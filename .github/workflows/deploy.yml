name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Deploy to Render
        env:
          GH_EMAIL: 13574196538@163.com
          GH_PASSWORD: zjp120310
          GH_PAT: ${{ secrets.GH_PAT || '' }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "$GH_PAT" | gh auth login --with-token 2>/dev/null || true
          fi

          python << 'PYEOF'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def main():
              github_token = os.environ.get('GH_PAT', '') or os.environ.get('GITHUB_TOKEN', '')

              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(viewport={'width': 1440, 'height': 900})
                  page = await ctx.new_page()

                  await page.add_init_script('''() => {
                      Object.defineProperty(navigator, 'webdriver', {get: () => false});
                      window.chrome = {runtime: {}};
                  }''')

                  print("Step 1: Go to GitHub...")
                  await page.goto('https://github.com', timeout=30000, wait_until='networkidle')
                  await page.wait_for_timeout(2000)
                  if github_token:
                      await page.evaluate('''(token) => {
                          document.cookie = "user_session=" + token + "; path=/; domain=.github.com";
                      }''', github_token)
                  await page.screenshot(path='/tmp/github_home.png')

                  print("Step 2: Go to Render...")
                  await page.goto('https://dashboard.render.com/login', timeout=30000, wait_until='networkidle')
                  await page.wait_for_timeout(3000)

                  try:
                      btn = page.locator('button:has-text("Accept All")')
                      if await btn.count() > 0:
                          await btn.click()
                          await page.wait_for_timeout(1000)
                  except:
                      pass

                  await page.screenshot(path='/tmp/render_login.png')

                  print("Step 3: Click GitHub OAuth...")
                  await page.click('button:has-text("GitHub")')
                  await page.wait_for_timeout(5000)

                  print("Step 4: Check result...")
                  for i in range(20):
                      await page.wait_for_timeout(3000)
                      url = page.url
                      print(f"  [{i}] {url[:120]}")

                      if 'dashboard.render.com' in url and 'login' not in url:
                          print("*** ON RENDER DASHBOARD! ***")
                          break

                      if 'authorize' in url:
                          try:
                              auth_btn = page.locator('button:has-text("Authorize"), button[name="authorize"]')
                              if await auth_btn.count() > 0:
                                  await auth_btn.first.click()
                                  print("Clicked authorize")
                                  await page.wait_for_timeout(5000)
                                  continue
                          except:
                              pass

                      if 'login' in url or 'session' in url:
                          text = await page.evaluate('() => document.body.innerText')
                          print(f"Page: {text[:200]}")
                          await page.screenshot(path='/tmp/login_page.png')

                          try:
                              login_field = page.locator('input[name="login"]')
                              if await login_field.count() > 0:
                                  await login_field.fill(os.environ['GH_EMAIL'])
                                  await page.wait_for_timeout(1000)
                                  await page.click('input[type="submit"]')
                                  await page.wait_for_timeout(3000)
                                  print(f"After email: {page.url[:80]}")

                                  pwd_field = page.locator('input[name="password"]')
                                  if await pwd_field.count() > 0:
                                      await pwd_field.fill(os.environ['GH_PASSWORD'])
                                      await page.wait_for_timeout(500)
                                      await page.click('input[type="submit"]')
                                      await page.wait_for_timeout(5000)
                                      print(f"After password: {page.url[:80]}")
                          except Exception as e:
                              print(f"Fill error: {e}")

                      if 'signup' in url.lower():
                          print("On signup page...")
                          signin = page.locator('a[href*="/login"]')
                          if await signin.count() > 0:
                              await signin.first.click()
                              await page.wait_for_timeout(5000)
                              print(f"Clicked sign in: {page.url[:80]}")
                              continue

                  print(f"Final URL: {page.url}")
                  await page.screenshot(path='/tmp/render_final.png')

                  if 'dashboard.render.com' in page.url and 'login' not in page.url:
                      print("\nStep 5: Creating Blueprint...")
                      await page.goto('https://dashboard.render.com/blueprints/new', timeout=30000, wait_until='networkidle')
                      await page.wait_for_timeout(5000)
                      await page.screenshot(path='/tmp/render_blueprint.png')

                      buttons = await page.evaluate('''() => {
                          var items = document.querySelectorAll('a, button');
                          var result = [];
                          for (var i = 0; i < items.length; i++) {
                              var b = items[i];
                              var text = (b.textContent || '').trim().slice(0, 100);
                              if (text) result.push({tag: b.tagName, text: text, href: (b.href || '').slice(0, 120)});
                          }
                          return result;
                      }''')
                      print(f"Elements: {buttons}")

                      for btn in buttons:
                          txt = btn['text'].lower()
                          if 'connect' in txt or 'github' in txt or 'install' in txt:
                              print(f"Clicking: {btn['text']}")
                              try:
                                  await page.click(f'button:has-text("{btn["text"]}"), a:has-text("{btn["text"]}")')
                                  await page.wait_for_timeout(5000)
                                  print(f"After click: {page.url[:80]}")
                              except Exception as e:
                                  print(f"Click error: {e}")

                      await page.screenshot(path='/tmp/render_connected.png')

                      if 'github.com' in page.url:
                          print("On GitHub App install page...")
                          await page.screenshot(path='/tmp/github_install.png')
                          try:
                              install_btn = page.locator('button:has-text("Install"), input[type="submit"][value*="Install"]')
                              if await install_btn.count() > 0:
                                  await install_btn.first.click()
                                  print("Clicked Install")
                                  await page.wait_for_timeout(5000)
                          except Exception as e:
                              print(f"Install click error: {e}")
                          await page.screenshot(path='/tmp/after_install.png')

                      await page.screenshot(path='/tmp/render_final.png')
                  else:
                      print("Failed to reach Render dashboard")

                  await browser.close()

          asyncio.run(main())
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-screenshots
          path: /tmp/render_*.png